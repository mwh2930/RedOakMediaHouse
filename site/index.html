  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

splay: swap;\n  src: url(\"cde53e3c-7e72-4466-8183-a33388bb1ff1\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Barlow';\n  font-style: normal;\n  font-weight: 500;\n  font-display: swap;\n  src: url(\"92cca7e3-2c1f-47a3-b6c9-35acd06f84d4\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Barlow';\n  font-style: normal;\n  font-weight: 500;\n  font-display: swap;\n  src: url(\"a079ec93-a564-448d-82e1-3d85e166855b\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* vietnamese */\n@font-face {\n  font-family: 'Barlow';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"594a5a60-462d-43a7-875d-eaccd4025166\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Barlow';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"f9680361-f710-4ee4-9e77-ff63bdf95ee0\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Barlow';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"16064108-0375-4e45-95ed-41a6 2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Barlow Condensed';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"5f5d74f7-f526-423f-a9a4-9aa483ba1fe9\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n:root {\n  --color-bg: #f2f2f3;\n  --color-surface: #e9e9ea;\n  --color-text: #1d1f20;\n  --color-accent: #5980a6;\n  --color-accent-2: #728fab;\n  --color-divider: color-mix(in srgb, #1d1f20 16%, transparent);\n\n  /* Tonal ramps \u2014 generated in OKLCH on one shared lightness scale, so the\n     same step of any role matches the others in visual value. */\n  --color-neutral-100: #f5f5f8;\n  --color-neutral-200: #e7e7ea;\n  --color-neutral-300: #d4d4d7;\n  --color-neutral-400: #b7b7ba;\n  --color-neutral-500: #98989b;\n  --color-neutral-600: #7a7a7d;\n  --color-neutral-700: #5d5d60;\n  --color-neutral-800: #424244;\n  --color-neutral-900: #2b2b2d;\n\n  --color-accent-100: #eef6ff;\n  --color-accent-200: #d6ebff;\n  --color-accent-300: #b5d9fd;\n  --color-accent-400: #94bce3;\n  --color-accent-500: #749dc4;\n  --color-accent-600: #597ea3;\n  --color-accent-700: #416180;\n  --color-accent-800: #2c455d;\n  --color-accent-900: #1d2d3d;\n\n  --color-accent-2-100: #eef6ff;\n  --color-accent-2-200: #d6ebff;\n  --color-accent-2-300: #bdd8f2;\n  --color-accent-2-400: #9ebbd8;\n  --color-accent-2-500: #7e9cb8;\n  --color-accent-2-600: #627d98;\n  --color-accent-2-700: #486077;\n  --color-accent-2-800: #314457;\n  --color-accent-2-900: #1f2d3a;\n\n  --font-heading: \"Barlow Condensed\", system-ui, sans-serif;\n  --font-heading-weight: 600;\n  --font-body: \"Barlow\", system-ui, sans-serif;\n\n  --space-1: 3.4px;\n  --space-2: 6.8px;\n  --space-3: 10.2px;\n  --space-4: 13.6px;\n  --space-6: 20.4px;\n  --space-8: 27.2px;\n\n  --radius-sm: 2px;\n  --radius-md: 4px;\n  --radius-lg: 7px;\n\n  /* Elevation \u2014 derived from the ground: soft ink-tinted shadows on a\n     light theme, a hairline edge + ambient darkness on a dark one. */\n  --shadow-sm: 0 1px 2px color-mix(in srgb, #2b2b2d 14%, transparent);\n  --shadow-md: 0 3px 10px color-mix(in srgb, #2b2b2d 16%, transparent);\n  --shadow-lg: 0 12px 32px color-mix(in srgb, #2b2b2d 22%, transparent);\n}\n\nbody {\n  background: var(--color-bg);\n  color: var(--color-text);\n  font-family: var(--font-body);\n}\nh1, h2, h3, h4 { font-family: var(--font-heading); font-weight: var(--font-heading-weight); }\n\n.blueprint {\n  position: relative;\n  border: 1px solid var(--color-divider);\n  border-radius: 0;\n}\n/* The overlay image treatments (halftone, duotone) clip their overlay\n   (overflow:hidden); a blueprint wrapper draws its registration marks\n   outside the box, so when both classes share a wrapper the frame must\n   win. */\n.blueprint.halftone, .blueprint.plate, .blueprint.duotone { overflow: visible; }\n.blueprint > .corner {\n  position: absolute; width: 11px; height: 11px;\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.blueprint > .corner::before, .blueprint > .corner::after {\n  content: \"\"; position: absolute; background: currentColor;\n}\n.blueprint > .corner::before { left: 5px; top: 0; width: 1px; height: 100%; }\n.blueprint > .corner::after  { top: 5px; left: 0; width: 100%; height: 1px; }\n.blueprint > .corner.tl { top: -6px; left: -6px; }\n.blueprint > .corner.tr { top: -6px; right: -6px; }\n.blueprint > .corner.bl { bottom: -6px; left: -6px; }\n.blueprint > .corner.br { bottom: -6px; right: -6px; }\n\n.duotone{position:relative;overflow:hidden}\n.duotone::after{content:\"\";position:absolute;inset:0;pointer-events:none;\n  background:var(--color-accent);mix-blend-mode:color}\n\n/* \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n   Components \u2014 built with the tokens above. Plain CSS\n   on plain HTML: no JavaScript, no build step. Each class is documented in\n   readme.md and demonstrated in foundations/ and components/.\n   \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 */\n\n*, *::before, *::after { box-sizing: border-box; }\nbody { margin: 0; font-size: 15px; line-height: 1.55; font-weight: 400; }\nh1, h2, h3, h4, h5, h6 {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2);\n}\nh1 { font-size: 42px; }\nh2 { font-size: 32px; }\nh3 { font-size: 25px; }\nh4 { font-size: 20px; }\nh5 { font-size: 16px; }\nh6 { font-size: 13px; }\nh6 { letter-spacing: 0.08em; text-transform: uppercase; }\np { margin: 0 0 var(--space-3); }\na { color: var(--color-accent); text-underline-offset: 3px; }\nimg { display: block; max-width: 100%; }\nfigure { margin: 0; }\nfigcaption {\n  font-size: 11px; margin-top: var(--space-1);\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }\n:focus { outline: none; }\n:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }\n\n/* \u2014 rules \u2014 */\n.hr {\n  height: 1px; border: 0; margin: var(--space-4) 0;\n  background: var(--color-divider);\n}\n\n/* \u2014 buttons \u2014 */\n.btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: 6px;\n  cursor: pointer; text-decoration: none;\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 14px; line-height: 1.2; color: var(--color-text); /* matches the .input's 14px \u2014\n     the pair sits side by side in sign-up rows */\n  background: transparent; border: 1px solid transparent;\n  padding: var(--space-2) calc(var(--space-3) * 1.2);\n  border-radius: var(--radius-md);\n}\n.btn svg { display: block; }\n.btn:disabled { opacity: 0.45; cursor: not-allowed; }\n.btn-primary { background: var(--color-accent); color: var(--color-bg); }\n.btn-primary:hover { background: var(--color-accent-600); }\n.btn-primary:active { background: var(--color-accent-700); }\n.btn-secondary { border-color: var(--color-divider); }\n.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }\n.btn-ghost { color: var(--color-accent); padding-inline: var(--space-1); }\n.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }\n.btn-ghost:active { background: color-mix(in srgb, var(--color-accent) 18%, transparent); }\n.btn-icon { width: 36px; height: 36px; padding: 0; }\n.btn-block { width: 100%; margin-top: var(--space-2); }\n\n/* \u2014 forms \u2014 */\n.field > label {\n  display: block; font-size: 12px; margin-bottom: 5px;\n  color: color-mix(in srgb, var(--color-text) 70%, transparent);\n}\n.input {\n  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;\n  font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);\n  background: var(--color-surface);\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }\n.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }\ntextarea.input { min-height: 90px; resize: vertical; }\n.radio { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }\n.radio input, .seg-opt input {\n  position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;\n}\n.radio .dot {\n  width: 16px; height: 16px; flex: none; border-radius: 50%;\n  border: 1.5px solid var(--color-divider);\n}\n.radio:hover .dot { border-color: var(--color-accent); }\n.radio input:checked + .dot {\n  border-color: var(--color-accent); background: var(--color-accent);\n  box-shadow: inset 0 0 0 4px var(--color-bg);\n}\n.radio input:focus-visible + .dot { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n.seg {\n  display: inline-flex; overflow: hidden;\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.seg-opt {\n  display: inline-flex; align-items: center; gap: 6px;\n  padding: 7px 12px; font-size: 13px; cursor: pointer;\n}\n.seg-opt + .seg-opt { border-left: 1px solid var(--color-divider); }\n.seg-opt:has(input:checked) { background: var(--color-accent); color: var(--color-bg); }\n.seg-opt:not(:has(input:checked)):hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.seg-opt:has(input:focus-visible) { outline: 2px solid var(--color-accent); outline-offset: -2px; }\n\n/* \u2014 cards \u2014 */\n.card {\n  display: flex; flex-direction: column; gap: var(--space-2);\n  padding: var(--space-3); border-radius: var(--radius-md); background: var(--color-surface);\n}\n.card-kicker { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); }\n.card-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 17px; line-height: 1.2;\n}\n.card-body { margin: 0; font-size: 13px; opacity: 0.8; flex: 1; }\n.card-meta {\n  display: flex; align-items: center; gap: 6px; font-size: 11px;\n  color: color-mix(in srgb, var(--color-text) 50%, transparent);\n}\n.elev-sm { box-shadow: var(--shadow-sm); }\n.elev-md { box-shadow: var(--shadow-md); }\n.elev-lg { box-shadow: var(--shadow-lg); }\n\n/* \u2014 tags \u2014 */\n.tag {\n  display: inline-flex; align-items: center; font-size: 11px;\n  letter-spacing: 0.02em; padding: 3px 10px;\n  border-radius: calc(var(--radius-md) * 0.75);\n}\n.tag-accent { background: var(--color-accent-100); color: var(--color-accent-800); }\n.tag-accent-2 { background: var(--color-accent-2-100); color: var(--color-accent-2-800); }\n.tag-neutral { background: var(--color-neutral-100); color: var(--color-neutral-800); }\n.tag-outline { border: 1px solid var(--color-accent); color: var(--color-accent); }\n\n/* \u2014 navigation \u2014 */\n.nav {\n  display: flex; align-items: center; gap: var(--space-4);\n  padding: var(--space-3) var(--space-4);\n  border-bottom: none;\n}\n.nav-brand {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 18px; margin-right: auto;\n}\n.nav a { color: inherit; text-decoration: none; font-size: 14px; }\n.nav a:hover, .nav a[aria-current='page'] { color: var(--color-accent); }\n\n/* \u2014 tables \u2014 */\n.table { width: 100%; border-collapse: collapse; font-size: 14px; }\n.table th {\n  text-align: left; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;\n  color: color-mix(in srgb, var(--color-text) 60%, transparent);\n  padding: var(--space-2); border-bottom: 1px solid var(--color-divider);\n}\n.table td {\n  padding: var(--space-2);\n  border-bottom: 1px solid color-mix(in srgb, var(--color-text) 8%, transparent);\n}\n m-title\">\n      \u003cdiv class=\"diagram-topline\">\u003cspan class=\"diagram-label\" id=\"diagram-title\">From idea to experience\u003c/span>\u003cbutton class=\"motion-control\" type=\"button\" sc-camel-on-click=\"{{ toggleMotion }}\" disabled=\"{{ reducedMotion }}\" aria-label=\"{{ motionControlLabel }}\">{{ motionButtonLabel }}\u003c/button>\u003c/div>\n      \u003cdiv class=\"diagram-canvas\" aria-hidden=\"true\">\n        \u003csvg class=\"diagram-routes\" sc-camel-view-box=\"0 0 440 305\" sc-camel-preserve-aspect-ratio=\"none\" fill=\"none\">\n          \u003cpath class=\"route-base\" d=\"M220 60V110 M220 174V190Q220 206 204 206H126Q110 206 110 222V238 M220 174V190Q220 206 236 206H314Q330 206 330 222V238\" />\n          \u003cpath class=\"route-flow route-trunk\" d=\"M220 60V110\" />\n          \u003cpath class=\"route-flow route-web\" d=\"M220 174V190Q220 206 204 206H126Q110 206 110 222V238\" />\n          \u003cpath class=\"route-flow route-ios\" d=\"M220 174V190Q220 206 236 206H314Q330 206 330 222V238\" />\n        \u003c/svg>\n        \u003cdiv class=\"diagram-node idea-node\">\u003cspan class=\"node-dot\">\u003c/span>Your idea\u003c/div>\n        \u003cdiv class=\"diagram-node core-node\">\u003cspan class=\"core-mark\">RO\u003c/span>\u003cspan>\u003cspan class=\"core-label\">RED OAK\u003c/span>\u003cstrong>Design + develop\u003c/strong>\u003c/span>\u003c/div>\n        \u003cdiv class=\"diagram-node output-node web-node\">\u003cspan class=\"output-icon\">{{ icoGlobe }}\u003c/span>\u003cspan>Website\u003c/span>\u003cspan class=\"port-light\">\u003c/span>\u003c/div>\n        \u003cdiv class=\"diagram-node output-node ios-node\">\u003cspan class=\"output-icon\">{{ icoPhone }}\u003c/span>\u003cspan>iOS app\u003c/span>\u003cspan class=\"port-light\">\u003c/span>\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"diagram-platforms\" role=\"group\" aria-label=\"Explore a development path\">\n        \u003cbutton type=\"button\" sc-camel-on-click=\"{{ chooseWeb }}\" aria-pressed=\"{{ webSelected }}\" aria-controls=\"diagram-description\">Website\u003c/button>\n        \u003cbutton type=\"button\" sc-camel-on-click=\"{{ chooseIOS }}\" aria-pressed=\"{{ iosSelected }}\" aria-controls=\"diagram-description\">iOS application\u003c/button>\n      \u003c/div>\n      \u003cfigcaption class=\"diagram-description\" id=\"diagram-description\" aria-live=\"polite\">{{ diagramDescription }}\u003c/figcaption>\n    \u003c/figure>\n  \u003c/section>\n  \u003csection id=\"build\" class=\"wrap section\" data-motion=\"{{ motionState }}\" aria-labelledby=\"build-title\">\n    \u003cdiv class=\"section-heading\">\n      \u003cdiv>\u003cdiv class=\"eyebrow\">Websites &amp; applications\u003c/div>\u003ch2 id=\"build-title\">Your \u003cstrong>idea.\u003c/strong>\u003cbr>A clear path to \u003cstrong>launch.\u003c/strong>\u003c/h2>\u003c/div>\n      \u003cdiv class=\"section-explainer\">\u003cp>Define what matters. Design how it works. Build and test it for the real world. These are the foundations of a website or application.\u003c/p>\u003cdiv class=\"motion-toolbar\">\u003cspan>Diagram motion\u003c/span>\u003cbutton class=\"motion-control\" type=\"button\" sc-camel-on-click=\"{{ toggleMotion }}\" disabled=\"{{ reducedMotion }}\" aria-label=\"{{ motionControlLabel }}\">{{ motionButtonLabel }}\u003c/button>\u003c/div>\u003c/div>\n    \u003c/div>\n    \u003col class=\"learning-grid\">\n      \u003cli class=\"lesson\">\u003cdiv class=\"lesson-top\">\u003cspan class=\"lesson-number\">01\u003c/span>\u003cspan>Define\u003c/span>\u003c/div>\u003ch3>Give the idea a purpose.\u003c/h3>\u003cp class=\"lesson-intro\">Identify who it helps, the problem it solves, and what the first version needs to do.\u003c/p>\u003cfigure class=\"wireframe\">\u003cdiv class=\"wireframe-canvas\">\u003csvg sc-camel-view-box=\"0 0 460 280\" sc-camel-preserve-aspect-ratio=\"xMidYMid meet\" fill=\"none\" aria-hidden=\"true\">\u003crect class=\"wf-box\" x=\"20\" y=\"48\" width=\"170\" height=\"65\" rx=\"8\"/>\u003ctext x=\"39\" y=\"76\">The audience\u003c/text>\u003cpath class=\"wf-line\" d=\"M40 94H164\"/>\u003crect class=\"wf-box\" x=\"20\" y=\"145\" width=\"170\" height=\"65\" rx=\"8\"/>\u003ctext x=\"39\" y=\"173\">The problem\u003c/text>\u003cpath class=\"wf-line\" d=\"M40 191H157\"/>\u003cpath class=\"wf-line\" d=\"M190 81H223V129H271 M190 177H223V129 M263 123L271 129L263 135\"/>\u003cpath class=\"visual-flow\" d=\"M190 81H223V129H271 M190 177H223V129\"/>\u003crect class=\"wf-box\" x=\"284\" y=\"25\" width=\"151\" height=\"210\" rx=\"10\"/>\u003ctext x=\"304\" y=\"59\">Project brief\u003c/text>\u003cpath class=\"wf-line\" d=\"M284 74H435 M308 100H409 M308 113H395 M308 145H409 M308 158H391\"/>\u003crect class=\"wf-box\" x=\"304\" y=\"182\" width=\"111\" height=\"29\" rx=\"5\"/>\u003ctext x=\"324\" y=\"202\" class=\"wf-small\">The goal\u003c/text>\u003c/svg>\u003c/div>\u003cfigcaption>A clear brief turns an idea into a focused project.\u003c/figcaption>\u003c/figure>\u003cdiv class=\"foundation-blocks\">\u003cspan>Foundation blocks\u003c/span>\u003cul>\u003cli>Audience &amp; problem\u003c/li>\u003cli>Essential features\u003c/li>\u003cli>Success criteria\u003c/li>\u003c/ul>\u003c/div>\u003cdetails class=\"lesson-depth\">\u003csummary>How this stage works\u003c/summary>\u003cp class=\"lesson-output\">\u003cspan>The outcome\u003c/span>A shared plan for what to build.\u003c/p>\u003cdiv class=\"lesson-fact\">\u003cstrong>Start with a focused first version\u003c/strong>\u003cp>Talk to the people the product is for. Prioritize the task that matters most, separate essentials from later ideas, and agree on how you will judge whether it works.\u003c/p>\u003ca class=\"lesson-source\" href=\"https://developer.apple.com/tutorials/develop-in-swift/ask-questions\">Apple \u00b7 Defining an app idea \u2197\u003c/a>\u003c/div>\u003c/details>\u003c/li>\n      \u003cli class=\"lesson\">\u003cdiv class=\"lesson-top\">\u003cspan class=\"lesson-number\">02\u003c/span>\u003cspan>Design\u003c/span>\u003c/div>\u003ch3>Map how it should work.\u003c/h3>\u003cp class=\"lesson-intro\">Turn the plan into a user journey and wireframes, then test whether the next step makes sense.\u003c/p>\u003cfigure class=\"wireframe\">\u003cdiv class=\"wireframe-canvas\">\u003csvg sc-camel-view-box=\"0 0 460 280\" sc-camel-preserve-aspect-ratio=\"xMidYMid meet\" fill=\"none\" aria-hidden=\"true\">\u003crect class=\"wf-box\" x=\"12\" y=\"42\" width=\"262\" height=\"176\" rx=\"10\"/>\u003cpath class=\"wf-line\" d=\"M12 68H274 M29 55h3 M41 55h3 M53 55h3\"/>\u003ctext x=\"29\" y=\"98\">Your content\u003c/text>\u003crect class=\"wf-box\" x=\"29\" y=\"115\" width=\"99\" height=\"66\" rx=\"4\"/>\u003cpath class=\"wf-line wf-dash\" d=\"M29 115L128 181 M128 115L29 181\"/>\u003cpath class=\"wf-line\" d=\"M146 118H253 M146 133H242 M146 148H248\"/>\u003crect class=\"wf-box\" x=\"146\" y=\"164\" width=\"91\" height=\"26\" rx=\"4\"/>\u003cpath class=\"wf-line\" d=\"M274 129H326 M318 123L326 129L318 135\"/>\u003cpath class=\"visual-flow\" d=\"M274 129H326\"/>\u003crect class=\"wf-box\" x=\"335\" y=\"17\" width=\"111\" height=\"224\" rx=\"16\"/>\u003cpath class=\"wf-line\" d=\"M373 29H405 M371 229H411\"/>\u003ctext x=\"347\" y=\"64\" class=\"wf-small\">Your content\u003c/text>\u003crect class=\"wf-box\" x=\"348\" y=\"78\" width=\"85\" height=\"56\" rx=\"4\"/>\u003cpath class=\"wf-line wf-dash\" d=\"M348 78L433 134 M433 78L348 134\"/>\u003cpath class=\"wf-line\" d=\"M348 151H431 M348 165H420\"/>\u003crect class=\"wf-box\" x=\"348\" y=\"182\" width=\"85\" height=\"28\" rx=\"4\"/>\u003ctext x=\"49\" y=\"258\" class=\"wf-small\">Wide layout\u003c/text>\u003ctext x=\"337\" y=\"263\" class=\"wf-small\">Narrow layout\u003c/text>\u003c/svg>\u003c/div>\u003cfigcaption>Wireframes organize the experience across screens.\u003c/figcaption>\u003c/figure>\u003cdiv class=\"foundation-blocks\">\u003cspan>Foundation blocks\u003c/span>\u003cul>\u003cli>Content &amp; navigation\u003c/li>\u003cli>Wireframes &amp; prototypes\u003c/li>\u003cli>Responsive &amp; accessible layouts\u003c/li>\u003c/ul>\u003c/div>\u003cdetails class=\"lesson-depth\">\u003csummary>How this stage works\u003c/summary>\u003cp class=\"lesson-output\">\u003cspan>The outcome\u003c/span>A tested direction before development.\u003c/p>\u003cdiv class=\"lesson-fact\">\u003cstrong>Work out the experience before the details\u003c/strong>\u003cp>Arrange the information and controls around real tasks. Use prototypes to find confusing steps early. Make room for different screen sizes, larger text, and accessible navigation as the design develops.\u003c/p>\u003ca class=\"lesson-source\" href=\"https://developer.apple.com/tutorials/develop-in-swift/welcome-to-app-design\">Apple \u00b7 Prototyping and testing \u2197\u003c/a>\u003c/div>\u003c/details>\u003c/li>\n      \u003cli class=\"lesson\">\u003cdiv class=\"lesson-top\">\u003cspan class=\"lesson-number\">03\u003c/span>\u003cspan>Build &amp; launch\u003c/span>\u003c/div>\u003ch3>Make it ready for real use.\u003c/h3>\u003cp class=\"lesson-intro\">Develop the website or app, test its behavior, and prepare a release that can improve over time.\u003c/p>\u003cfigure class=\"wireframe\">\u003cdiv class=\"wireframe-canvas\">\u003csvg sc-camel-view-box=\"0 0 460 280\" sc-camel-preserve-aspect-ratio=\"xMidYMid meet\" fill=\"none\" aria-hidden=\"true\">\u003crect class=\"wf-box\" x=\"12\" y=\"44\" width=\"124\" height=\"159\" rx=\"10\"/>\u003crect class=\"wf-box\" x=\"168\" y=\"44\" width=\"124\" height=\"159\" rx=\"10\"/>\u003crect class=\"wf-box\" x=\"324\" y=\"44\" width=\"124\" height=\"159\" rx=\"10\"/>\u003cpath class=\"wf-line\" d=\"M12 70H136 M168 70H292 M324 70H448\"/>\u003ctext x=\"30\" y=\"62\" class=\"wf-small\">Build\u003c/text>\u003ctext x=\"182\" y=\"62\" class=\"wf-small\">Test\u003c/text>\u003ctext x=\"341\" y=\"62\" class=\"wf-small\">Release\u003c/text>\u003crect class=\"wf-box\" x=\"28\" y=\"116\" width=\"92\" height=\"37\" rx=\"6\"/>\u003ctext x=\"53\" y=\"141\">Code\u003c/text>\u003crect class=\"wf-box\" x=\"181\" y=\"120\" width=\"98\" height=\"12\" rx=\"6\"/>\u003cpath class=\"wf-line wf-accent\" d=\"M188 126H247\"/>\u003ctext x=\"189\" y=\"158\" class=\"wf-small\">Checking\u2026\u003c/text>\u003cpath class=\"wf-line wf-accent\" d=\"M359 118L376 136L410 99\"/>\u003ctext x=\"360\" y=\"165\">Ready\u003c/text>\u003cpath class=\"wf-line\" d=\"M136 126H168 M292 126H324 M160 120L168 126L160 132 M316 120L324 126L316 132\"/>\u003cpath class=\"visual-flow\" d=\"M136 126H168 M292 126H324\"/>\u003ctext x=\"36\" y=\"240\" class=\"wf-small\">Build \u2192 validate \u2192 release\u003c/text>\u003c/svg>\u003c/div>\u003cfigcaption>Build, verify, and prepare the finished experience.\u003c/figcaption>\u003c/figure>\u003cdiv class=\"foundation-blocks\">\u003cspan>Foundation blocks\u003c/span>\u003cul>\u003cli>Code &amp; data\u003c/li>\u003cli>Testing, security &amp; privacy\u003c/li>\u003cli>Release &amp; ongoing improvements\u003c/li>\u003c/ul>\u003c/div>\u003cdetails class=\"lesson-depth\">\u003csummary>How this stage works\u003c/summary>\u003cp class=\"lesson-output\">\u003cspan>The outcome\u003c/span>A working product with a path forward.\u003c/p>\u003cdiv class=\"lesson-fact\">\u003cstrong>Check the whole journey before release\u003c/strong>\u003cp>Connect the interface to the data and services it needs. Test key tasks, errors, and accessibility; review security and privacy. Prepare hosting or an App Store submission, then use feedback to guide updates.\u003c/p>\u003ca class=\"lesson-source\" href=\"https://developer.apple.com/documentation/xcode/testing\">Apple \u00b7 Testing app behavior \u2197\u003c/a>\u003c/div>\u003c/details>\u003c/li>\n    \u003c/ol>\n  \u003c/section>\n  \u003csection id=\"promise\" class=\"wrap section\" aria-labelledby=\"process-title\">\n    \u003cdiv class=\"section-heading\">\n      \u003cdiv>\u003cdiv class=\"eyebrow\">How we work\u003c/div>\u003ch2 id=\"process-title\">Four \u003cstrong>questions.\u003c/strong>\u003cbr>One clear \u003cstrong>path.\u003c/strong>\u003c/h2>\u003c/div>\n      \u003cp>Each stage answers a different question. Together, they turn a loose idea into something people can understand and use.\u003c/p>\n    \u003c/div>\n    \u003col class=\"process\">\n      \u003cli>\u003cspan class=\"step\">01\u003c/span>\u003cspan class=\"step-label\">Define\u003c/span>\u003ch3>Who is it for?\u003c/h3>\u003cp>Understand the audience, the problem to solve, and what a useful outcome looks like.\u003c/p>\u003c/li>\n      \u003cli>\u003cspan class=\"step\">02\u003c/span>\u003cspan class=\"step-label\">Design\u003c/span>\u003ch3>How should it work?\u003c/h3>\u003cp>Map the journey. Arrange the content and controls. Make the next step easy to understand.\u003c/p>\u003c/li>\n      \u003cli>\u003cspan class=\"step\">03\u003c/span>\u003cspan class=\"step-label\">Build\u003c/span>\u003ch3>How do we make it?\u003c/h3>\u003cp>Develop the website or iOS application, connecting the design to working behavior.\u003c/p>\u003c/li>\n      \u003cli>\u003cspan class=\"step\">04\u003c/span>\u003cspan class=\"step-label\">Refine\u003c/span>\u003ch3>What is ready to launch?\u003c/h3>\u003cp>Test the experience, resolve the details, and prepare the next steps for release.\u003c/p>\u003c/li>\n    \u003c/ol>\n  \u003c/section>\n  \u003csection id=\"contact\" class=\"contact\" aria-labelledby=\"contact-title\">\n    \u003cdiv class=\"wrap contact-inner\">\n      \u003cdiv class=\"contact-copy\">\n        \u003ch2 id=\"contact-title\">Start a \u003cstrong>project.\u003c/strong>\u003c/h2>\n        \u003cp>Tell us what you want to build, who it is for, and what you want it to achieve. Start with a website, an iOS app, or an idea we can help you shape.\u003c/p>\n        \u003ca href=\"mailto:Support@redoakmediahouse.com\">Support@redoakmediahouse.com\u003c/a>\n      \u003c/div>\n      \u003cform class=\"project-form\" sc-camel-on-submit=\"{{ openEmailDraft }}\" aria-describedby=\"email-help\">\n        \u003cfieldset>\n          \u003clegend>What would you like to build?\u003c/legend>\n          \u003cdiv class=\"project-options\">\n            \u003clabel class=\"project-option\">\u003cinput type=\"radio\" name=\"projectType\" value=\"Website\" required>Website\u003c/label>\n            \u003clabel class=\"project-option\">\u003cinput type=\"radio\" name=\"projectType\" value=\"iOS application\">iOS application\u003c/label>\n            \u003clabel class=\"project-option\">\u003cinput type=\"radio\" name=\"projectType\" value=\"Both / exploring an idea\">Both / exploring\u003c/label>\n          \u003c/div>\n        \u003c/fieldset>\n        \u003cdiv class=\"field-row\">\n          \u003clabel class=\"field\" for=\"project-name\">Name\u003cinput id=\"project-name\" name=\"name\" type=\"text\" autocomplete=\"name\" maxlength=\"120\" required>\u003c/label>\n          \u003clabel class=\"field\" for=\"project-email\">Email\u003cinput id=\"project-email\" name=\"email\" type=\"email\" autocomplete=\"email\" maxlength=\"254\" required>\u003c/label>\n        \u003c/div>\n        \u003clabel class=\"field\" for=\"project-details\">Tell us about your project\u003ctextarea id=\"project-details\" name=\"details\" rows=\"4\" maxlength=\"1800\" required placeholder=\"Your idea, your audience, and what you want to achieve.\">\u003c/textarea>\u003c/label>\n        \u003cp class=\"form-help\" id=\"email-help\">This opens a draft in your email app. Review and send it there to contact us.\u003c/p>\n        \u003cbutton class=\"button\" type=\"submit\">Open email draft \u003cspan aria-hidden=\"true\">\u2197\u003c/span>\u003c/button>\n        \u003cdiv role=\"status\" aria-live=\"polite\">\n          \u003csc-if value=\"{{ draftOpened }}\" hint-placeholder-val=\"{{ false }}\">\u003cp class=\"draft-status\">Finish sending in your email app. If no draft opened, email \u003ca href=\"mailto:Support@redoakmediahouse.com\">Support@redoakmediahouse.com\u003c/a> directly. Your details remain above.\u003c/p>\u003c/sc-if>\n        \u003c/div>\n      \u003c/form>\n    \u003c/div>\n  \u003c/section>\n\u003c/main>\n\u003cfooter class=\"wrap site-footer\">\n  \u003cdiv class=\"footer-brand\">\u003cimg src=\"f04d7547-d6fb-4fe3-a2d9-718582d8f1c3\" alt=\"\" width=\"27\" height=\"27\">\u003cspan>Red Oak Media House\u003c/span>\u003c/div>\n  \u003ca href=\"/privacy.html\">Privacy Policy\u003c/a>\n  \u003cspan>\u00a9 2026 Red Oak Media House\u003c/span>\n\u003c/footer>\n\u003c/x-dc>\n\u003cscript type=\"text/x-dc\" data-dc-script>\nclass Component extends DCLogic {\n  state = { draftOpened: false, diagramMode: 'web', motionPaused: true, reducedMotion: false };\n\n  componentDidMount() {\n    this.motionQuery = window.matchMedia('(prefers-reduced-motion: reduce)');\n    this.onMotionPreference = (event) => this.setState({ motionPaused: event.matches, reducedMotion: event.matches });\n    this.setState({ motionPaused: this.motionQuery.matches, reducedMotion: this.motionQuery.matches });\n    this.motionQuery.addEventListener('change', this.onMotionPreference);\n  }\n\n  componentWillUnmount() {\n    this.motionQuery?.removeEventListener('change', this.onMotionPreference);\n  }\n\n  icon(paths) {\n    return React.createElement('svg', {\n      viewBox: '0 0 24 24', width: 24, height: 24, fill: 'none', stroke: 'currentColor',\n      strokeWidth: 1.5, strokeLinecap: 'round', strokeLinejoin: 'round', 'aria-hidden': true\n    }, paths.map((d, i) => React.createElement('path', { key: i, d: d })));\n  }\n\n  renderVals() {\n    const I = (paths) => this.icon(paths);\n    return {\n      icoGlobe: I(['M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20z', 'M2 12h20', 'M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z']),\n      icoPhone: I(['M7 2h10a2 2 0 0 1 2 2v16a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2z', 'M12 18h.01']),\n      icoGrid: I(['M3 3h7v7H3z', 'M14 3h7v7h-7z', 'M3 14h7v7H3z', 'M14 14h7v7h-7z']),\n      icoRefresh: I(['M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8', 'M3 3v5h5']),\n      draftOpened: this.state.draftOpened,\n      diagramMode: this.state.diagramMode,\n      webSelected: this.state.diagramMode === 'web',\n      iosSelected: this.state.diagramMode === 'ios',\n      motionPaused: this.state.motionPaused,\n      motionState: this.state.motionPaused ? 'paused' : 'playing',\n      reducedMotion: this.state.reducedMotion,\n      motionButtonLabel: this.state.reducedMotion ? 'Motion off' : this.state.motionPaused ? 'Play' : 'Pause',\n      motionControlLabel: this.state.reducedMotion ? 'Motion off: reduced motion is enabled on your device' : this.state.motionPaused ? 'Play all diagram animations' : 'Pause all diagram animations',\n      chooseWeb: () => this.setState({ diagramMode: 'web' }),\n      chooseIOS: () => this.setState({ diagramMode: 'ios' }),\n      toggleMotion: () => { if (!this.state.reducedMotion) this.setState({ motionPaused: !this.state.motionPaused }); },\n      diagramDescription: this.state.diagramMode === 'web'\n        ? 'Start with your idea. Shape the content and interface. Build a website people can use in their browser.'\n        : 'Start with your idea. Plan the screens and interactions. Build an application for Apple iOS.', \n      openEmailDraft: (event) => {\n        event.preventDefault();\n        const form = event.currentTarget;\n        for (const fieldName of ['name', 'email', 'details']) {\n          const input = form.elements.namedItem(fieldName);\n          input.value = input.value.trim();\n        }\n        if (!form.reportValidity()) return;\n        const fields = new FormData(form);\n        const type = String(fields.get('projectType') || 'Project inquiry');\n        const name = String(fields.get('name') || '').trim();\n        const email = String(fields.get('email') || '').trim();\n        const details = String(fields.get('details') || '').trim();\n        if (!name || !email || !details) return;\n        const subject = 'Red Oak project inquiry: ' + type;\n        const body = ['Project: ' + type, 'Name: ' + name, 'Email: ' + email, '', details].join('\\r\\n');\n        window.location.href = 'mailto:Support@redoakmediahouse.com?subject=' + encodeURIComponent(subject) + '&body=' + encodeURIComponent(body);\n        this.setState({ draftOpened: true });\n      }\n    };\n  }\n}\n\u003c/script>\n\u003c/body>\n\u003c/html>\n"
  </script>
</body>
</html>
